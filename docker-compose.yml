services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scenegraph
      MINIO_ROOT_PASSWORD: scenegraph-local
    ports: ["9000:9000", "9001:9001"]
    volumes: [scenegraph-minio:/data]
volumes:
  scenegraph-minio:
