name: scenegraph

services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${SCENEGRAPH_PORT:-8080}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      studio:
        condition: service_healthy
      director:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    cpus: 0.15
    networks: [scenegraph]

  studio:
    image: ghcr.io/teckedd-code2save/scenegraph-studio:${SCENEGRAPH_IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      STUDIO_PORT: 3000
      SCENEGRAPH_API_URL: ""
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 96m
    cpus: 0.20
    networks: [scenegraph]

  director:
    image: ghcr.io/teckedd-code2save/scenegraph-director:${SCENEGRAPH_IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DIRECTOR_PORT: 4100
      REDIS_URL: redis://redis:6379
      SCENEGRAPH_DATA_DIR: /data/projects
      RENDER_OUTPUT_DIR: /data/renders
      SCENEGRAPH_PUBLIC_URL: ${SCENEGRAPH_PUBLIC_URL:?Set the public HTTPS URL}
      SCENEGRAPH_ACCESS_TOKEN: ${SCENEGRAPH_ACCESS_TOKEN:?Set a strong access token}
      MODAL_RENDER_URL: ${MODAL_RENDER_URL:?Set the deployed Modal renderer URL}
      MODAL_RENDER_TOKEN: ${MODAL_RENDER_TOKEN:?Set the shared Modal renderer token}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?Set the Cloudflare account ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set an R2 access key ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set an R2 secret access key}
      R2_BUCKET: ${R2_BUCKET:-scenegraph-media}
      NODE_OPTIONS: --max-old-space-size=256
    expose: ["4100"]
    volumes:
      - scenegraph-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    cpus: 0.50
    networks: [scenegraph]

  render-worker:
    image: ghcr.io/teckedd-code2save/scenegraph-render-worker:${SCENEGRAPH_IMAGE_TAG:-main}
    profiles: ["local-renderer"]
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      RENDER_OUTPUT_DIR: /data/renders
      CHROME_PATH: /usr/bin/chromium
      REMOTION_BROWSER_EXECUTABLE: /usr/bin/chromium
      REMOTION_MEDIA_CACHE_MB: 128
      REMOTION_VIDEO_CACHE_MB: 128
    volumes:
      - scenegraph-data:/data
    depends_on:
      redis:
        condition: service_healthy
      director:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    cpus: 2.0
    shm_size: 512mb
    networks: [scenegraph]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - scenegraph-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 192m
    cpus: 0.25
    networks: [scenegraph]

networks:
  scenegraph:
    driver: bridge

volumes:
  scenegraph-data:
  scenegraph-redis:
