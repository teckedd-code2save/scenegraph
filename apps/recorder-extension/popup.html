<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body{width:340px;margin:0;padding:18px;font:14px Inter,system-ui;color:#151715;background:#f7f7f3}
    h1{font-size:19px;margin:0 0 4px}.sub{margin:0 0 16px;color:#62665f;font-size:13px;line-height:1.35}.workspace{border:1px solid #d5d8d0;background:#fff;padding:12px;margin-bottom:12px;border-radius:7px}
    .workspace span,label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;color:#62665f}.workspace strong{display:block;font-size:14px;line-height:1.3;word-break:break-word}.workspace code{display:block;margin-top:7px;font-size:11px;color:#62665f;word-break:break-all}
    .field{margin:0 0 12px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cfd2cb;border-radius:7px;background:white}
    button{width:100%;padding:12px;border:0;border-radius:7px;background:#168fe1;color:white;font-weight:650;cursor:pointer}
    button.stop{background:#242724;margin-top:8px}button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:20px;margin-top:12px;color:#565b54;line-height:1.35}
    details{margin-top:14px;border-top:1px solid #d5d8d0;padding-top:12px}summary{cursor:pointer;color:#62665f;font-size:12px;font-weight:650}
  </style>
</head>
<body>
  <h1>SceneGraph Capture</h1>
  <p class="sub">Pair this extension from Studio, then record the product tab.</p>
  <div class="workspace">
    <span>Paired workspace</span>
    <strong id="workspaceName">Not paired yet</strong>
    <code id="workspaceId">Open Studio and choose Connect extension.</code>
  </div>
  <button id="start">Record clean tab</button>
  <button id="stop" class="stop">Stop & upload</button>
  <div id="status" class="status"></div>
  <details>
    <summary>Advanced connection</summary>
    <div class="field"><label for="api">Studio API</label><input id="api" value="http://localhost:4100"></div>
    <div class="field"><label for="token">Access token</label><input id="token" type="password" autocomplete="off" placeholder="Your deployment token"></div>
    <div class="field"><label for="project">Project ID</label><input id="project" placeholder="Pair from Studio or paste manually"></div>
  </details>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
